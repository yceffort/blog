# 3편: 클러스터 안에서 트래픽을 만드는 클라이언트 파드.
# macOS 호스트는 ClusterIP에 닿지 않고, port-forward 경유 부하는 파드 하나에 고정되므로
# 분배·타임라인 실측은 전부 이 파드 안의 Node로 수행한다. (헤어핀 오염 방지를 위해 앱과 별도 파드)
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  containers:
    - name: node
      image: k8s-fe-lab:standalone
      imagePullPolicy: Never
      command: ['sleep', 'infinity']
