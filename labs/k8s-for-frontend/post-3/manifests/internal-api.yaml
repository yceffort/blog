# 3편: SSR 내부 호출 데모용 두 번째 Service. 같은 이미지를 다른 이름으로 띄운다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: internal-api
  template:
    metadata:
      labels:
        app: internal-api
    spec:
      containers:
        - name: app
          image: k8s-fe-lab:standalone
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests: {cpu: '250m', memory: '256Mi'}
            limits: {cpu: '500m', memory: '512Mi'}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: internal-api
spec:
  selector:
    app: internal-api
  ports:
    - port: 80
      targetPort: 3000
