# 3편: Service 타입 계층(LoadBalancer ⊃ NodePort ⊃ ClusterIP) 실측 + Gateway API 라우팅.
# cloud-provider-kind가 떠 있어야 EXTERNAL-IP가 배정된다.
apiVersion: v1
kind: Service
metadata:
  name: k8s-fe-lab-lb
spec:
  type: LoadBalancer
  selector:
    app: k8s-fe-lab
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fe-gateway
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fe-route
spec:
  parentRefs:
    - name: fe-gateway
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: k8s-fe-lab
          port: 80
