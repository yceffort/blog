# 시나리오 B: NEXT_MANUAL_SIG_HANDLE=true인데 핸들러를 달지 않은 상태.
# PID 1은 핸들러 없는 신호를 무시하므로 SIGTERM이 통째로 무시되고 grace 30초를 태운 뒤 SIGKILL(137).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graceful-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: graceful-lab
  template:
    metadata:
      labels:
        app: graceful-lab
      annotations:
        scenario: b-ignored
    spec:
      containers:
        - name: app
          image: k8s-fe-lab:standalone
          env:
            - name: RESPONSE_DELAY_MS
              value: '400'
            - name: NEXT_MANUAL_SIG_HANDLE
              value: 'true'
          resources:
            requests: {cpu: '300m', memory: '256Mi'}
            limits: {cpu: '1', memory: '512Mi'}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
