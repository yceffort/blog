# 시나리오 A: 2편의 naive 이미지(CMD ["npm","start"]). PID 1이 npm이라
# SIGTERM이 서버(next-server)까지 전달되지 않고 트리가 무너진다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graceful-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: graceful-lab
  template:
    metadata:
      labels:
        app: graceful-lab
      annotations:
        scenario: a-naive
    spec:
      containers:
        - name: app
          image: k8s-fe-lab:naive
          env:
            - name: RESPONSE_DELAY_MS
              value: '400'
          resources:
            requests: {cpu: '300m', memory: '256Mi'}
            limits: {cpu: '1', memory: '512Mi'}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
