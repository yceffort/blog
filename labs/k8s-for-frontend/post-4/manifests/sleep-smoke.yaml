# 사전 검증 4: 네이티브 preStop sleep 액션(v1.34 GA) 스모크
apiVersion: v1
kind: Pod
metadata:
  name: sleep-smoke
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  containers:
    - name: app
      image: k8s-fe-lab:standalone
      lifecycle:
        preStop:
          sleep:
            seconds: 5
