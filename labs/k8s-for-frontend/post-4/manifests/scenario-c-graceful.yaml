# 시나리오 C (기준선): Next 16 standalone 기본값. node가 PID 1로 SIGTERM을 받아 드레인한다.
apiVersion: v1
kind: Service
metadata:
  name: graceful-lab
spec:
  selector:
    app: graceful-lab
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graceful-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: graceful-lab
  template:
    metadata:
      labels:
        app: graceful-lab
      annotations:
        scenario: c-graceful
    spec:
      containers:
        - name: app
          image: k8s-fe-lab:standalone
          env:
            - name: RESPONSE_DELAY_MS
              value: '400' # 페이지 응답을 늘려 SIGTERM 시점에 in-flight가 걸쳐 있게 한다
          resources:
            requests: {cpu: '300m', memory: '256Mi'}
            limits: {cpu: '1', memory: '512Mi'}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
