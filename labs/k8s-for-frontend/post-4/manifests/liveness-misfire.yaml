# 4편: 같은 "깊은 헬스체크"(/api/health-deep, 다운스트림 internal-api 검사)를
# liveness에 건 배포와 readiness에 건 배포. internal-api를 내리면 앞쪽만 연쇄 재시작이 난다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-live
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deep-live
  template:
    metadata:
      labels:
        app: deep-live
    spec:
      containers:
        - name: app
          image: k8s-fe-lab:standalone
          resources:
            requests: {cpu: '200m', memory: '256Mi'}
            limits: {cpu: '500m', memory: '512Mi'}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health-deep, port: 3000}
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-ready
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deep-ready
  template:
    metadata:
      labels:
        app: deep-ready
    spec:
      containers:
        - name: app
          image: k8s-fe-lab:standalone
          resources:
            requests: {cpu: '200m', memory: '256Mi'}
            limits: {cpu: '500m', memory: '512Mi'}
          readinessProbe:
            httpGet: {path: /api/health-deep, port: 3000}
            periodSeconds: 5
            failureThreshold: 3
