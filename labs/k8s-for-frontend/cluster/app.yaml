apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-fe-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-fe-lab
  template:
    metadata:
      labels:
        app: k8s-fe-lab
    spec:
      containers:
        - name: app
          image: k8s-fe-lab:standalone
          imagePullPolicy: Never # kind load로 밀어넣은 로컬 이미지 사용
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: '500m'
              memory: '256Mi'
            limits:
              cpu: '1'
              memory: '512Mi'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-fe-lab
spec:
  selector:
    app: k8s-fe-lab
  ports:
    - port: 80
      targetPort: 3000
