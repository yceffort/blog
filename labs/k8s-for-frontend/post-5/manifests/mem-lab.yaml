# 5편: 메모리 HPA 실패 재현용. memory requests를 128Mi로 낮춰
# 유휴 RSS(~67Mi)=52%, 부하 RSS(~140Mi)=109%가 되게 한다.
apiVersion: v1
kind: Service
metadata:
  name: mem-lab
spec:
  selector:
    app: mem-lab
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mem-lab
  template:
    metadata:
      labels:
        app: mem-lab
    spec:
      containers:
        - name: app
          image: localhost:5001/k8s-fe-lab:standalone
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: '250m', memory: '128Mi'}
            limits: {cpu: '500m', memory: '512Mi'}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
