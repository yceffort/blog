# 5편: KEDA cron+cpu 이중 트리거. 예측 가능한 스파이크(출근 시간)를 cron으로 선제 확장하고,
# 예측 밖 부하는 cpu 트리거가 받친다. 적용 전 기존 HPA(autoscale-lab)를 삭제할 것(소유권 충돌).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: autoscale-lab
spec:
  scaleTargetRef:
    name: autoscale-lab
  minReplicaCount: 3
  maxReplicaCount: 12
  triggers:
    - type: cron
      metadata:
        timezone: Asia/Seoul
        start: __START__ * * * *
        end: __END__ * * * *
        desiredReplicas: '9'
    - type: cpu
      metricType: Utilization
      metadata:
        value: '70'
