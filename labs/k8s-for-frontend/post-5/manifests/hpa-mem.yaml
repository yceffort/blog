# 5편: 메모리 사용률 기반 HPA. V8이 RSS를 반납하지 않아 스케일 인이 불발되는 것을 관찰한다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mem-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mem-lab
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
