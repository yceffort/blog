name: CI

on:
  push:
    branches-ignore:
      - main

jobs:
  lint-and-prettier:
    name: Lint & Prettier
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm prettier
      - run: pnpm --filter blog lint:style

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-prettier]
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: corepack enable
      - run: corepack prepare --activate
      - run: pnpm install --frozen-lockfile

      - name: Install WASI SDK
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz --output wasi-sdk.tar.gz
          echo "b7d4d944c88503e4f21d84af07ac293e3440b1b6210bfd7fe78e0afd92c23bc2  wasi-sdk.tar.gz" | sha256sum --check
          tar -xzf wasi-sdk.tar.gz

      - run: pnpm build
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-27.0-x86_64-linux

  lighthouse:
    # 임시막기
    if: false
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - run: corepack enable
      - run: corepack prepare --activate

      - name: install & build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
