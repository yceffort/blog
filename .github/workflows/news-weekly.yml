name: news-weekly

# schedule은 첫 수동 실행이 성공한 뒤 따로 넣는다. 올리는 순간 크론이 켜지는 것을 피한다.
on:
  workflow_dispatch:

# 일간과 같은 그룹으로 묶어 월요일 겹침을 직렬화한다.
concurrency:
  group: news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 일간 호도 외부 글의 요약이다. 일간과 같이 읽기 권한만 준다.
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      week: ${{ steps.date.outputs.week }}
      written: ${{ steps.check.outputs.written }}
    steps:
      # 수집기를 돌리지 않으므로 node와 pnpm이 필요 없다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 큐레이터에게 셸을 주지 않으므로 날짜는 여기서 정해 넘긴다.
      - id: date
        run: |
          echo "today=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "start=$(TZ=Asia/Seoul date -d '-6 day' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "week=$(TZ=Asia/Seoul date +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: 주간 호 작성
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            `services/news/prompts/weekly.md` 파일을 읽고, 거기 적힌 작업을 그대로 수행한다.
            그 문서가 이 작업의 유일한 지시서다. 오늘 날짜는 ${{ steps.date.outputs.today }}, ISO 주차는 ${{ steps.date.outputs.week }}, 6일 전 날짜는 ${{ steps.date.outputs.start }} 이다.
          # 실패하면 요약 JSON만으로는 원인을 알 수 없다. 전체 출력을 남긴다.
          show_full_output: 'true'
          claude_args: |
            --allowedTools "Read(services/news/**),Read(apps/news/content/**),Glob,Grep,Edit(apps/news/content/weekly/**)"

      - id: check
        run: |
          if [ -f "apps/news/content/weekly/${{ steps.date.outputs.week }}.md" ]; then
            echo 'written=true' >> "$GITHUB_OUTPUT"
          else
            echo '지난 7일의 일간 호가 없어 주간 호를 만들지 않았다.'
            echo 'written=false' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.written == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: news-weekly
          path: apps/news/content/weekly/${{ steps.date.outputs.week }}.md
          retention-days: 3

  publish:
    needs: curate
    if: needs.curate.outputs.written == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: apps/news/content/weekly/${{ needs.curate.outputs.week }}.md
    steps:
      # main은 보호 규칙이 있어 기본 GITHUB_TOKEN으로는 푸시하지 못한다.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NEWS_BOT_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: news-weekly
          path: ${{ runner.temp }}/news

      # 파일 하나만 올린 artifact는 경로 없이 파일만 담긴다.
      - run: cp "$RUNNER_TEMP/news/$(basename "$ISSUE")" "$ISSUE"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      # oxfmt와 rust-markdownlint는 루트 devDependency다.
      - run: pnpm install --frozen-lockfile --filter yceffort-monorepo

      - run: |
          pnpm exec oxfmt "$ISSUE"
          pnpm exec rust-markdownlint --fix --no-globs "$ISSUE"

      - name: 커밋과 푸시
        run: |
          git config user.name 'news-bot'
          git config user.email 'root@yceffort.kr'
          git add apps/news/content/weekly
          if git diff --cached --quiet; then
            echo '변경 없음. 커밋하지 않는다.'
            exit 0
          fi
          # 포맷과 린트는 위에서 끝났다. lefthook은 전체 의존성을 요구하므로 건너뛴다.
          git commit --no-verify -m "news weekly: ${{ needs.curate.outputs.week }}"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "push 실패. rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
          done
          exit 1
