name: Notify new posts
on:
  push:
    branches: [main]
    paths:
      - 'apps/blog/posts/**/*.md'
      - 'apps/blog/series/*.md'
  workflow_dispatch:
    inputs:
      files:
        description: 'Post paths to notify (space separated)'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect added posts
        id: added
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="${{ inputs.files }}"
          else
            # Diff the whole pushed range, not just the head commit: a push of
            # several commits (e.g. post + translation) lands here once, and
            # HEAD^..HEAD would only see the last commit's files.
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
            files=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'apps/blog/posts/**/*.md' 'apps/blog/series/*.md' | grep -v '\.en\.md$' || true)
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Wait for blog deploy
        if: steps.added.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The site answers 200 even for unknown post URLs (soft 404), so
          # polling the post URL cannot tell whether the deploy is live.
          # Wait for a successful "Production – blog" Vercel deployment that
          # contains this commit — Vercel may skip an intermediate commit and
          # deploy a newer one instead, which still includes these posts.
          # 30 min: the blog build is slow and its deployment record can lag
          # well behind the push while queued.
          for _ in $(seq 1 90); do
            git fetch --quiet origin main
            while read -r id sha; do
              if git merge-base --is-ancestor "$GITHUB_SHA" "$sha" 2>/dev/null; then
                state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" \
                  --jq '.[0].state // empty' || true)
                echo "deployment $id ($sha) state: ${state:-pending}"
                if [ "$state" = "success" ]; then
                  exit 0
                fi
              fi
            done < <(gh api "repos/${{ github.repository }}/deployments" \
              -X GET -f environment="Production – blog" -f per_page=10 \
              --jq '.[] | "\(.id) \(.sha)"' || true)
            sleep 20
          done
          echo "timed out waiting for a blog deploy containing $GITHUB_SHA"
          exit 1

      - uses: actions/setup-node@v4
        if: steps.added.outputs.files != ''
        with:
          node-version: 24

      - name: Send push notifications
        if: steps.added.outputs.files != ''
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FILES: ${{ steps.added.outputs.files }}
        run: |
          npm install --no-save web-push
          echo "$FILES" | xargs node apps/blog/scripts/notify-push.mjs
