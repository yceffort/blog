  function nice(v) {
    const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p
    const st = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p, max = Math.ceil(v / st) * st, ticks = []

  // 세로 막대(누적 포함). 막대는 24px 이하, 맨 위 조각만 둥글게, 조각 사이는 배경색 2px.
  function cols(el, o) {
    const draw = () => {
      const W = el.clientWidth; if (!W) return
      const H = o.h || 220, m = { t: 16, r: 6, b: o.marks ? 46 : 34, l: 36 }, iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.cols.length
      const sc = o.ticks ? { max: o.ticks[o.ticks.length - 1], ticks: o.ticks } : nice(Math.max(o.ref ? o.ref.v * 1.08 : 0, ...o.cols.map(c => sum(c.vals))))
      const step = iw / n, bw = Math.min(24, Math.max(3, step - (step > 16 ? 8 : step > 9 ? 4 : 2))), y = v => m.t + ih - v / sc.max * ih
      let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${o.aria}">`
      o.cols.forEach((c, i) => { if (c.band) s += `<rect class="band" x="${m.l + i * step}" y="${m.t}" width="${step}" height="${ih}"/>` })
      for (const k of sc.ticks) s += `<line class="${k ? 'grid' : 'axis'}" x1="${m.l}" x2="${W - m.r}" y1="${y(k)}" y2="${y(k)}"/><text x="${m.l - 6}" y="${y(k) + 3.5}" text-anchor="end">${fmt(k)}</text>`

        const top = c.vals.reduce((a, v, k) => (v > 0 ? k : a), -1)
        c.vals.forEach((v, k) => {
          if (!(v > 0)) return
          const y1 = y(acc + v), yb = y(acc) - (below ? 2 : 0); acc += v; below = true
          const hh = Math.max(yb - y1, 1), r = k === top ? Math.min(4, bw / 2, hh) : 0, yt = yb - hh
          s += `<path class="${o.series[k].cls}" d="M${x},${yb}V${yt + r}Q${x},${yt} ${x + r},${yt}H${x + bw - r}Q${x + bw},${yt} ${x + bw},${yt + r}V${yb}Z"/>`
        })
        if (c.cap) s += `<text class="strong" x="${cx}" y="${y(acc) - 6}" text-anchor="middle">${c.cap}</text>`
        const a = o.xl(i, step), b = o.xl2 && o.xl2(i, step)
        if (a) s += `<text ${c.hl ? 'class="strong" ' : ''}x="${cx}" y="${m.t + ih + 15}" text-anchor="middle">${a}</text>`
        if (b) s += `<text x="${cx}" y="${m.t + ih + 28}" text-anchor="middle">${b}</text>`
        if (c.mark) s += `<circle class="mk" cx="${cx}" cy="${H - 7}" r="4"/>`
      })
      if (o.ref) s += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${y(o.ref.v)}" y2="${y(o.ref.v)}"/><text class="strong" x="${W - m.r - 2}" y="${y(o.ref.v) - 5}" text-anchor="end">${o.ref.label}</text>`
      o.cols.forEach((c, i) => { s += `<rect class="hit" data-i="${i}" x="${m.l + i * step}" y="${m.t}" width="${step}" height="${ih + 4}"/>` })

    el.innerHTML = items.map(i => `<span class="k">${i.k}</span><span class="t"><i class="${sw}" style="width:${i.v / mx * 100}%"></i></span><span class="n">${fmt(i.v)}${unit}${total ? ` <small>${(i.v / total * 100).toFixed(0)}%</small>` : ''}</span>`).join('')

    const avg = D.hm.map((row, w) => row.map(v => v / cnt[w])), mx = Math.max(...avg.flat())
    const draw = () => {

      let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${t('요일과 시간대별로 직접 쓴 프롬프트와 슬랙 메시지의 하루 평균 건수', 'Average prompts and Slack messages I wrote per day, by weekday and hour')}">`
      for (let h = 0; h < 24; h += 3) s += `<text x="${ml + h * cw + cw / 2}" y="11" text-anchor="middle">${h}</text>`

  const lg = (sw, name) => `<span><i class="sw ${sw}"></i>${name}</span>`
  const xlDay = list => (i, step) => (HL.size ? (HL.has(list[i].d) ? md(list[i]) : '') : list[i].w === '월' || i === 0 || step > 30 ? md(list[i]) : '')
  const xlDow = list => (i, step) => (HL.size ? (HL.has(list[i].d) ? dow(list[i].w) : '') : step > 30 ? dow(list[i].w) : '')
  const blockMark = lg('dot bn1', t('집중 블록을 잡아 둔 날', 'Days with a focus block on the calendar'))

  const V = {
    stay() {
      main.innerHTML = blk('a', '', lg('line bcrit', t('60분', '60 minutes')) + blockMark)
      cols($('a'), { aria: t('평일 22일 동안 하루 중 한 가지 일만 가장 오래 한 시간. 모든 날이 60분에 못 미친다', 'Longest single-context stretch on each of 22 weekdays; none reaches 60 minutes'), unit: U.min, h: 240, marks: true,
        series: [{ name: t('한 가지 일만 가장 오래 한 시간', 'Longest stretch on one thing'), cls: 'cn1', sw: 'bn1' }], ref: { v: 60, label: t('60분', '60 min') },
        cols: wd.map(d => ({ vals: [d.stay], mark: d.fb, hl: HL.has(d.d), title: `${md(d)} (${dow(d.w)})` })), xl: xlDay(wd), xl2: xlDow(wd) })
    },
    make() {
      main.innerHTML = blk('a', '', '')
      cols($('a'), { aria: t('30일 동안 날마다 만든 PR 수', 'Pull requests opened per day over 30 days'), unit: U.pr, h: 230,
        series: [{ name: 'PR', cls: 'cn1', sw: 'bn1' }],
        cols: days.map(d => ({ vals: [d.pr], band: isWe(d), hl: HL.has(d.d), title: `${md(d)} (${dow(d.w)})`, extra: `${t('커밋', 'Commits')} ${fmt(d.cm)}${U.n}, ${t('프롬프트', 'prompts')} ${fmt(d.p)}${U.n}` })), xl: xlDay(days), xl2: xlDow(days) })
    },
    slack() {
      main.innerHTML = blk('a', t('슬랙 메시지를 쓴 곳', 'Where my Slack messages went') + `<small>${t('31일, 6,207건', '31 days, 6,207 messages')}</small>`, '', 'hbars') +
        blk('b', t('팀 동료들과의 대화방에 쓴 메시지', 'Messages in the group chat with teammates') + `<small>${t('요일별 하루 평균', 'daily average by weekday')}</small>`, '')
      hbars($('a'), D.slack.map(r => ({ k: t(r.ko, r.en), v: r.n })), 'b2', U.n, sum(D.slack.map(r => r.n)))
      const w5 = ['월', '화', '수', '목', '금']
      cols($('b'), { aria: t('팀 동료들과의 대화방 요일별 하루 평균 메시지 수', 'Average messages per day in the teammate group chat by weekday'), unit: U.n, h: 170,
        series: [{ name: t('메시지', 'Messages'), cls: 'c2', sw: 'b2' }],
        cols: D.gdm.map((v, i) => ({ vals: [v], title: dow(w5[i]), cap: fmt(v) })), xl: i => dow(w5[i]) })
    },
    meet() {
      main.innerHTML = blk('a', t('평일 10~19시 540분', 'The 540 minutes between 10:00 and 19:00 on a weekday'), lg('b4', t('회의 203분', 'Meetings, 203 min')) + lg('bn3', t('회의가 아닌 시간 337분', 'Everything else, 337 min')), 'seg') +
        blk('b', t('회의 시간의 구성', 'What the meeting time was') + `<small>${t('평일 하루 평균(분)', 'weekday daily average, minutes')}</small>`, '', 'hbars')
      seg($('a'), [{ k: t('회의', 'Meetings'), v: 203, unit: U.min, sw: 'b4', label: '38%' }, { k: t('회의가 아닌 시간', 'Everything else'), v: 337, unit: U.min, sw: 'bn3', label: '62%' }])
      hbars($('b'), D.meet.map(r => ({ k: t(r.ko, r.en), v: r.v })), 'b4', U.min, sum(D.meet.map(r => r.v)))
    },
    reply() {
      main.innerHTML = blk('a', t('채널에 쓴 3,227건', 'The 3,227 messages I wrote in channels'), lg('b2', t('남이 연 스레드에 단 답글', 'Replies in threads')) + lg('bn3', t('새로 쓴 글', 'New posts')), 'seg') +
        blk('b', t('답글을 쓴 채널', 'Which channels'), '', 'hbars')
      seg($('a'), [{ k: t('답글', 'Replies'), v: D.reply[0], unit: U.n, sw: 'b2', label: `${fmt(D.reply[0])}${U.n} (97%)` }, { k: t('새 글', 'New posts'), v: D.reply[1], unit: U.n, sw: 'bn3', label: '' }])
      hbars($('b'), [{ k: t('팀 밖 채널', 'Channels outside my team'), v: D.team[1] }, { k: t('우리 팀 채널', 'Own team channels'), v: D.team[0] }], 'b2', U.n)
    },
    heatmap() {
      main.innerHTML = blk('a', t('직접 쓴 프롬프트와 슬랙 메시지', 'Prompts and Slack messages I wrote') + `<small>${t('요일과 시간대별 하루 평균, 진할수록 많음', 'daily average by weekday and hour; darker is more')}</small>`, '') +
        blk('b', t('시간대별 커밋', 'Commits by hour') + `<small>${t('31일 합', '31 days total')}</small>`, '')
      heat($('a'))
      cols($('b'), { aria: t('시간대별 커밋 수, 31일 합', 'Commits by hour of day, 31 days total'), unit: U.n, h: 170,
        series: [{ name: t('커밋', 'Commits'), cls: 'cn1', sw: 'bn1' }],
        cols: D.ch.map((v, h) => ({ vals: [v], band: h < 10 || h >= 19, title: `${h}${t('시대', ':00')}` })), xl: (i, step) => (step > 22 || i % 3 === 0 ? String(i) : '') })
    },
    window() {
      main.innerHTML = blk('a', '', lg('b3', t('슬랙도 회의도 없이 25분 이상 이어진 시간', 'Stretches of 25+ min with no Slack and no meeting')) + lg('b4', t('회의', 'Meetings')) + lg('b2', t('회의는 없는데 25분이 되기 전에 슬랙을 쓴 시간', 'Non-meeting time broken by Slack within 25 min')) + blockMark)
      cols($('a'), { aria: t('평일 22일의 10시부터 19시까지 540분 구성', 'How the 540 minutes between 10:00 and 19:00 were spent on 22 weekdays'), unit: U.min, h: 260, marks: true, ticks: [0, 180, 360, 540],
        series: [{ name: t('조용한 시간', 'Quiet time'), cls: 'c3', sw: 'b3' }, { name: t('회의', 'Meetings'), cls: 'c4', sw: 'b4' }, { name: t('슬랙을 쓴 시간', 'Broken by Slack'), cls: 'c2', sw: 'b2' }],
        cols: wd.map(d => ({ vals: [d.quiet, d.meet, Math.max(0, 540 - d.quiet - d.meet)], mark: d.fb, hl: HL.has(d.d), title: `${md(d)} (${dow(d.w)})` })), xl: xlDay(wd), xl2: xlDow(wd) })
    },
    months() {
      main.innerHTML = blk('a', '', '')
      cols($('a'), { aria: t('5월부터 최근 30일까지 평일 하루 평균 슬랙 메시지 수', 'Average Slack messages per weekday from May to the last 30 days'), unit: U.n, h: 230,
        series: [{ name: t('평일 하루 평균', 'Weekday daily average'), cls: 'c2', sw: 'b2' }],
        cols: D.base.map((b, i) => ({ vals: [b.v], title: t(b.ko, b.en), cap: i === 0 || i === 3 || i === D.base.length - 1 ? fmt(b.v) : '' })), xl: i => t(D.base[i].ko, D.base[i].en) })
    },
    sessions() {
      const lv = [t('1개', '1'), t('2개', '2'), t('3개', '3'), t('4개', '4'), t('5개 이상', '5 or more')], rn = [t('1건', '1'), t('2건', '2'), t('3~4건', '3-4'), t('5~9건', '5-9'), t('10건 이상', '10 or more')]
      const pct = (el, labels, vals, sw) => { const tot = sum(vals), mx = Math.max(...vals); el.innerHTML = vals.map((v, i) => `<span class="k">${labels[i]}</span><span class="t"><i class="${sw}" style="width:${v / mx * 100}%"></i></span><span class="n">${(v / tot * 100).toFixed(0)}%</span>`).join('') }
      main.innerHTML = blk('a', t('동시에 돌아가던 세션 수', 'Sessions running at the same time') + `<small>${t('세션이 하나라도 돌아가던 시간 가운데', 'share of time with at least one session active')}</small>`, '', 'hbars') +
        blk('b', t('한 세션에 연달아 보낸 프롬프트 수', 'Prompts sent to one session in a row') + `<small>${t('다른 세션으로 넘어가기 전까지', 'before moving to another session')}</small>`, '', 'hbars')
      pct($('a'), lv, D.live, 'b1'); pct($('b'), rn, D.runs, 'b1')
    },
    day() {
      const d = wd.find(x => x.d === (params.get('d') || '10-22')) || wd[0]
      const rows = [['p', t('프롬프트', 'Prompts'), U.n], ['se', t('연 세션', 'Sessions opened'), t('개', '')], ['s', t('슬랙 메시지', 'Slack messages'), U.n], ['sw', t('세션과 대화방을 옮겨 다닌 횟수', 'Switches to another session or chat'), t('번', '')], ['meet', t('회의', 'Meetings'), U.min], ['qm', t('슬랙도 회의도 없이 가장 길게 이어진 시간', 'Longest stretch with no Slack and no meeting'), U.min], ['stay', t('한 가지 일만 가장 오래 한 시간', 'Longest stretch on one thing'), U.min], ['pr', t('만든 PR', 'PRs opened'), U.pr]]
      const med = k => { const v = wd.map(x => x[k]).sort((a, b) => a - b); return (v[10] + v[11]) / 2 }
      main.innerHTML = blk('a', `${md(d)} (${dow(d.w)})`, lg('b1', t('그날의 값', 'That day')) + lg('line bn1', t('평일 22일의 중앙값', 'Median of the 22 weekdays')), 'hbars wide')
      $('a').innerHTML = rows.map(([k, name, unit]) => { const mx = Math.max(...wd.map(x => x[k])), m = med(k); return `<span class="k">${name}</span><span class="t rel"><i class="b1" style="width:${d[k] / mx * 100}%"></i><u style="left:${m / mx * 100}%"></u></span><span class="n">${fmt(d[k])}${unit} <small>${t('중앙값', 'median')} ${fmt(m)}</small></span>` }).join('')
    },
    sessday() {
      main.innerHTML = blk('a', '', '')
      cols($('a'), { aria: t('30일 동안 날마다 연 Claude Code 세션 수', 'Claude Code sessions opened per day over 30 days'), unit: t('개', ''), h: 230,
        series: [{ name: t('연 세션', 'Sessions opened'), cls: 'c1', sw: 'b1' }],
        cols: days.map(d => ({ vals: [d.se], band: isWe(d), hl: HL.has(d.d), title: `${md(d)} (${dow(d.w)})`, extra: `${t('프롬프트', 'Prompts')} ${fmt(d.p)}${U.n}` })), xl: xlDay(days), xl2: xlDow(days) })
    },
    daily() {
      main.innerHTML = blk('a', '', lg('b1', t('Claude Code 프롬프트', 'Claude Code prompts')) + lg('b2', t('슬랙 메시지', 'Slack messages')))
      cols($('a'), { aria: t('30일 동안 날마다 쓴 프롬프트와 슬랙 메시지 수', 'Prompts and Slack messages written per day over 30 days'), unit: U.n, h: 250,
        series: [{ name: t('프롬프트', 'Prompts'), cls: 'c1', sw: 'b1' }, { name: t('슬랙', 'Slack'), cls: 'c2', sw: 'b2' }],
        cols: days.map(d => ({ vals: [d.p, d.s], band: isWe(d), hl: HL.has(d.d), title: `${md(d)} (${dow(d.w)})`, extra: `PR ${fmt(d.pr)}${U.pr}, ${t('커밋', 'commits')} ${fmt(d.cm)}${U.n}` })), xl: xlDay(days), xl2: xlDow(days) })
    },
  }
  ;(V[view] || V.stay)()

  // 본문에 삽입했을 때 그림 높이를 프레임에 반영한다.
  const hostFrame = window.frameElement
  if (hostFrame && typeof ResizeObserver === 'function') {
    const fitFrame = () => {
      const bodyStyle = getComputedStyle(document.body), frameStyle = getComputedStyle(hostFrame)
      const spacing = [bodyStyle.paddingTop, bodyStyle.paddingBottom, frameStyle.borderTopWidth, frameStyle.borderBottomWidth].reduce((a, v) => a + (parseFloat(v) || 0), 0)
      const height = `${Math.ceil(main.getBoundingClientRect().height + spacing)}px`
      if (hostFrame.style.height !== height) hostFrame.style.height = height
    }
    new ResizeObserver(fitFrame).observe(main)
  }
})()
</script>
</body>
</html>
