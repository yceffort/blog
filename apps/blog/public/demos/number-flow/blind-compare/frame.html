<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>number-flow 빌드 하나</title>
  <style>
    :root { color-scheme:light dark; --bg:#fff; --ink:#252338; --bad:#c23a3a; }
    @media (prefers-color-scheme:dark) { :root { --bg:#23232f; --ink:#f0eef8; --bad:#ff8a8a; } }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
    /* 측정 페이지(bench.html)와 같은 글꼴. 숫자 폭 고정 조건은 monospace */
    body { display:grid; place-items:center; font:600 min(26px, 12vw)/1.2 system-ui, sans-serif; }
    body.mono { font-family:monospace; }
    .error { font:12px/1.4 system-ui, sans-serif; color:var(--bad); padding:0 10px; text-align:center; }
  </style>
</head>
<body>
  <number-flow id="nf"></number-flow>
  <script>
    // 같은 출처의 부모(index.html)가 postMessage로 값을 보낸다.
    // 커스텀 엘리먼트 이름이 모두 number-flow라 빌드마다 문서를 따로 둔다.
    const BUILDS = ['upstream', 'fork', 'opus', 'sonnet', 'fable', 'astra', 'terra']
    const params = new URLSearchParams(location.search)
    const build = params.get('build')
    const lang = params.get('lang') === 'en' ? 'en' : 'ko'
    const t = (ko, en) => (lang === 'en' ? en : ko)
    if (lang === 'en') {
      document.documentElement.lang = 'en'
      document.title = 'One number-flow build'
    }
    const nf = document.getElementById('nf')
    const post = (message) => parent.postMessage({...message, build}, location.origin)
    let base = null

    // 멈추기. Web Animations API 애니메이션은 pause() 로 서지만, 인터럽트 중에 requestAnimationFrame 으로 도는 경로(astra 빌드)는
    // 그대로 움직인다. 그래서 requestAnimationFrame 과 performance.now 를 함께 동결한다. 번들이 로드되기 전에 감싸야 한다.
    const clock = (() => {
      const nativeRaf = window.requestAnimationFrame.bind(window)
      const nativeCaf = window.cancelAnimationFrame.bind(window)
      const nativeNow = performance.now.bind(performance)
      let paused = false
      let offset = 0 // 멈춰 있던 시간의 합. 재생 중에는 now() 와 프레임 시각에서 뺀다
      let pausedAt = 0
      let nextId = 1
      const requests = new Map() // 재생을 재개해도 취소에 쓰는 요청 ID는 유지한다
      const schedule = (id, request) => {
        request.handle = nativeRaf((t) => {
          if (!requests.has(id)) return
          request.handle = null
          if (paused) return
          requests.delete(id)
          request.callback(t - offset)
        })
      }
      performance.now = () => (paused ? pausedAt : nativeNow() - offset)
      window.requestAnimationFrame = (callback) => {
        const id = nextId++
        const request = {callback, handle: null}
        requests.set(id, request)
        if (!paused) schedule(id, request)
        return id
      }
      window.cancelAnimationFrame = (id) => {
        const request = requests.get(id)
        if (request?.handle != null) nativeCaf(request.handle)
        requests.delete(id)
      }
      return {
        pause() {
          if (paused) return
          pausedAt = nativeNow() - offset
          paused = true
          requests.forEach((request) => {
            if (request.handle != null) nativeCaf(request.handle)
            request.handle = null
          })
        },
        play() {
          if (!paused) return
          offset = nativeNow() - pausedAt
          paused = false
          requests.forEach((request, id) => schedule(id, request))
        },
      }
    })()

    function fail(message) {
      nf.remove()
      const p = document.createElement('p')
      p.className = 'error'
      p.textContent = message
      document.body.appendChild(p)
      post({type: 'error', message})
    }

    addEventListener('error', (event) => fail(event.message))

    addEventListener('message', (event) => {
      if (event.source !== parent || !base) return
      const data = event.data || {}
      if (data.type === 'update') nf.update(data.value)
      if (data.type === 'font') document.body.classList.toggle('mono', Boolean(data.mono))
      if (data.type === 'speed') {
        nf.transformTiming = {...base.transform, duration: base.transform.duration * data.factor}
        nf.opacityTiming = {...base.opacity, duration: base.opacity.duration * data.factor}
      }
      // document.getAnimations()에는 shadow root 안의 애니메이션이 들어 있지 않아 둘을 합친다
      if (data.type === 'pause') {
        ;[...document.getAnimations(), ...(nf.shadowRoot?.getAnimations() ?? [])].forEach((a) => (data.paused ? a.pause() : a.play()))
        if (data.paused) clock.pause()
        else clock.play()
      }
    })

    if (!BUILDS.includes(build)) {
      fail(t('알 수 없는 빌드', 'Unknown build'))
    } else {
      const script = document.createElement('script')
      script.src = `builds/${build}.js`
      script.onerror = () => fail(t('번들을 불러오지 못했다', 'Failed to load the bundle'))
      script.onload = () => {
        nf.format = {style: 'percent', signDisplay: 'always', maximumFractionDigits: 0}
        nf.locales = 'en-US'
        base = {
          transform: nf.transformTiming || {duration: 900},
          opacity: nf.opacityTiming || {duration: 450, easing: 'ease-out'},
        }
        post({type: 'ready'})
      }
      document.head.appendChild(script)
    }
  </script>
</body>
</html>
