<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>number-flow 갱신 순서와 강제 레이아웃</title>
  <style>
    :root { color-scheme: light dark; --bg:#fbfaf7; --panel:#fff; --ink:#252338; --muted:#706d7d; --line:#e5e1ec; --violet:#6550d8; --teal:#137b6b; --amber:#b76216; --soft:#f0edf9; --read:#8fd3c4; --write:#f3c99a; --forced:#6550d8; }
    @media (prefers-color-scheme:dark) { :root { --bg:#181820; --panel:#23232f; --ink:#f0eef8; --muted:#b5b0c5; --line:#3d394d; --violet:#ad9aff; --teal:#66d9bf; --amber:#ffbd7a; --soft:#302b45; --read:#2f7d6d; --write:#8a5a2a; --forced:#ad9aff; } }
    * { box-sizing:border-box; }
    body { margin:0; padding:22px; background:var(--bg); color:var(--ink); font:14px/1.65 system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif; }
    main { max-width:820px; margin:auto; }
    [hidden] { display:none !important; }
    h1 { margin:3px 0 8px; font-size:clamp(20px,4vw,26px); line-height:1.35; letter-spacing:-.04em; }
    p { margin:0; }
    .eyebrow { font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--violet); }
    .intro,.note { color:var(--muted); font-size:13px; }
    .intro { margin-bottom:18px; }
    .note { margin-top:12px; font-size:12px; }
    .cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .card { min-width:0; padding:16px; border:1px solid var(--line); background:var(--panel); border-radius:16px; }
    .card h2 { font-size:13px; font-weight:650; margin:0 0 8px; display:flex; justify-content:space-between; gap:8px; }
    .card h2 small { color:var(--muted); font-weight:500; }
    .violet { color:var(--violet); }
    .amber { color:var(--amber); }
    .teal { color:var(--teal); }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px; }
    .stats div { background:var(--soft); padding:8px 6px; border-radius:9px; text-align:center; font-size:11px; color:var(--muted); }
    .stats strong { display:block; font-size:20px; line-height:1.2; color:var(--ink); font-variant-numeric:tabular-nums; }
    .stats .forced strong { color:var(--violet); }
    .strip { display:flex; flex-wrap:wrap; gap:3px; min-height:60px; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
    .strip span { width:9px; height:14px; border-radius:2px; background:var(--line); opacity:.35; }
    .strip span.done { opacity:1; }
    .strip span.r { background:var(--read); }
    .strip span.w { background:var(--write); }
    .strip span.f { background:var(--forced); height:18px; margin-top:-2px; }
    .strip span.now { outline:2px solid var(--ink); outline-offset:1px; opacity:1; }
    .op { margin-top:10px; min-height:44px; font-size:12px; line-height:1.5; }
    .op b { font-weight:650; }
    .op .tag { display:inline-block; padding:0 6px; border-radius:6px; font-size:11px; font-weight:700; margin-right:6px; }
    .tag.r { background:var(--read); color:#0a2a23; }
    .tag.w { background:var(--write); color:#3a2208; }
    .tag.f { background:var(--forced); color:#fff; }
    .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin:10px 0 0; }
    .legend i { display:inline-block; width:10px; height:12px; border-radius:2px; vertical-align:-2px; margin-right:5px; }
    .controls { margin-top:18px; padding-top:15px; border-top:1px solid var(--line); }
    .buttons { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:12px; }
    button,select { border:1px solid var(--line); border-radius:9px; padding:8px 14px; color:var(--ink); background:var(--panel); font:inherit; font-size:13px; cursor:pointer; min-height:38px; }
    button.primary { color:var(--bg); background:var(--violet); border-color:var(--violet); font-weight:650; }
    button:hover { filter:brightness(.94); }
    button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid var(--teal); outline-offset:3px; }
    .scrub-label { display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:4px; color:var(--muted); }
    input[type=range] { width:100%; margin:0; accent-color:var(--violet); min-height:28px; cursor:pointer; }
    output { font-variant-numeric:tabular-nums; }
    .field { display:flex; flex-wrap:wrap; gap:4px; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--bg); max-height:150px; overflow:hidden; }
    .field i { display:block; height:10px; width:40px; background:var(--read); border-radius:2px; }
    .bars { display:grid; grid-template-columns:auto 1fr auto; gap:8px 12px; align-items:center; margin-top:14px; font-size:13px; }
    .bar { height:16px; border-radius:4px; background:var(--violet); min-width:2px; transition:width .3s; }
    .bar.teal { background:var(--teal); }
    .bars output { font-variant-numeric:tabular-nums; min-width:5em; text-align:right; }
    .result-note { margin-top:10px; font-size:12px; color:var(--muted); min-height:20px; }
    @media (max-width:560px) { body { padding:16px; } .cards { grid-template-columns:1fr; gap:8px; } .card { padding:12px; } .stats strong { font-size:17px; } }
    @media (prefers-reduced-motion:reduce) { .bar { transition:none; } }
  </style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
  </header>

  <section id="order" hidden>
    <div class="buttons">
      <label for="scenario" style="font-size:12px;color:var(--muted)">갱신 종류</label>
      <select id="scenario" aria-label="갱신 종류">
        <option value="same">같은 자릿수: +123,456,789% → +987,654,321%</option>
        <option value="grows">자릿수 증가: +5% → +123,456,789%</option>
        <option value="shrinks">자릿수 감소: +123,456,789% → +5%</option>
        <option value="symbols">기호만 제거: +5% → 5</option>
        <option value="native-same">네이티브 엔진, 같은 자릿수 (flush와 prepare 포함)</option>
      </select>
    </div>
    <div class="cards">
      <div class="card" data-version="v0.2.0">
        <h2><span class="amber">v0.2.0</span><small>섹션마다, 글자마다 읽고 쓴다</small></h2>
        <div class="stats"><div>작업<strong data-stat="step">0</strong></div><div>읽기 / 쓰기<strong data-stat="rw">0 / 0</strong></div><div class="forced">쓰기 뒤 읽기<strong data-stat="forced">0</strong></div></div>
        <div class="strip" aria-hidden="true"></div>
        <p class="op" aria-live="polite"></p>
      </div>
      <div class="card" data-version="v0.2.1">
        <h2><span class="teal">v0.2.1</span><small>읽기 단계와 쓰기 단계를 번갈아</small></h2>
        <div class="stats"><div>작업<strong data-stat="step">0</strong></div><div>읽기 / 쓰기<strong data-stat="rw">0 / 0</strong></div><div class="forced">쓰기 뒤 읽기<strong data-stat="forced">0</strong></div></div>
        <div class="strip" aria-hidden="true"></div>
        <p class="op" aria-live="polite"></p>
      </div>
    </div>
    <p class="legend"><span><i style="background:var(--read)"></i>읽기</span><span><i style="background:var(--write)"></i>쓰기</span><span><i style="background:var(--forced)"></i>쓰기 뒤의 읽기 (모델 집계)</span></p>
    <div class="controls">
      <div class="buttons"><button type="button" class="primary" id="play">재생</button><button type="button" id="restart">처음으로</button><button type="button" id="next-forced">다음 보라색 표시</button></div>
      <label class="scrub-label" for="step"><span>작업을 하나씩 넘기기</span><output id="step-output" for="step">0</output></label>
      <input type="range" id="step" min="0" max="1" value="0" step="1" aria-label="진행한 작업 수">
    </div>
  </section>

  <section id="thrash" hidden>
    <div class="card">
      <div class="buttons">
        <label for="count" style="font-size:12px;color:var(--muted)">상자 수</label>
        <select id="count" aria-label="상자 수"><option value="100">100</option><option value="300" selected>300</option><option value="1000">1000</option></select>
        <button type="button" class="primary" id="run-interleaved">섞어서: 상자마다 읽고 바로 쓰기</button>
        <button type="button" id="run-batched">모아서: 모두 읽고, 모두 쓰기</button>
      </div>
      <div class="field" id="field" aria-hidden="true"></div>
      <div class="bars" id="bars">
        <span class="violet">섞어서</span><div class="bar" id="bar-interleaved" style="width:0"></div><output id="ms-interleaved">-</output>
        <span class="teal">모아서</span><div class="bar teal" id="bar-batched" style="width:0"></div><output id="ms-batched">-</output>
      </div>
      <p class="result-note" id="thrash-note">두 버튼을 눌러 비교해 보세요. 각 버튼은 같은 쓰기를 5번 반복한 중앙값을 보여 줍니다.</p>
    </div>
  </section>
  <p class="note" id="note"></p>
</main>

<script>
  const scenes = {
    order: {
      eyebrow: '01 / 갱신 한 번의 읽기와 쓰기',
      title: '읽기와 쓰기를 단계별로 모았습니다',
      intro: '값 하나를 바꾸는 동안 라이브러리가 DOM을 읽고 쓴 순서를 보여 줍니다. DOM을 바꾼 뒤 값을 읽은 부분은 보라색으로 표시했습니다. 브라우저에서 실제로 레이아웃을 계산했는지는 이 기록만으로 알 수 없습니다.',
      note: '포크의 코드를 jsdom에서 실행하며 기록했습니다. DOM 변경은 MutationObserver로 확인하고, 레이아웃과 스타일을 읽는 API 호출도 기록했습니다. jsdom은 레이아웃을 계산하지 않으므로 실제 횟수는 본문의 브라우저 측정 표를 참고하세요. 같은 글자의 값을 바꾸는 작업과 요소를 제거했다가 삽입하는 작업은 한 칸으로 합쳤습니다. Web Animations의 모의 구현에는 브라우저 내부의 스타일 갱신이 포함되지 않습니다.',
    },
    thrash: {
      eyebrow: '02 / 쓰기 뒤의 읽기',
      title: '폭을 바꾸고 레이아웃을 계산하는 데 걸린 시간',
      intro: '상자의 폭을 읽고 바꾸는 작업을 두 가지 순서로 실행합니다. 두 방식 모두 40px에서 56px로 바꾸며, 마지막 변경에 따른 레이아웃 계산이 끝날 때까지 시간을 잽니다.',
      note: 'performance.now()로 5회 측정한 중앙값입니다. 초기 폭을 설정하고 레이아웃을 계산하는 시간은 제외했습니다. 폭을 바꾼 뒤 마지막으로 레이아웃을 계산하는 시간은 포함하며, 페인트와 합성 시간은 포함하지 않습니다. 결과는 기기와 브라우저에 따라 달라집니다.',
    },
  }
  const requested = new URLSearchParams(location.search).get('scene')
  const scene = Object.hasOwn(scenes, requested) ? requested : 'order'
  const config = scenes[scene]
  const $ = (id) => document.getElementById(id)
  document.title = config.title + ' | number-flow'
  $('title').textContent = config.title
  $('eyebrow').textContent = config.eyebrow
  $('intro').textContent = config.intro
  $('note').textContent = config.note
  $(scene).hidden = false
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')

  if (scene === 'order') {
    const data = JSON.parse($('order-data').textContent)
    const versions = ['v0.2.0', 'v0.2.1']
    const cards = Object.fromEntries(versions.map((v) => [v, document.querySelector(`[data-version="${v}"]`)]))
    let current = 'same'
    let step = 0
    let timer = 0
    const seq = (v) => data[v][current].ops
    const maxLen = () => Math.max(...versions.map((v) => seq(v).length))
    function build() {
      for (const v of versions) {
        const strip = cards[v].querySelector('.strip')
        strip.replaceChildren(...seq(v).map((op) => {
          const el = document.createElement('span')
          el.className = op.k === 'R' ? (op.f ? 'r f' : 'r') : 'w'
          return el
        }))
      }
      $('step').max = String(maxLen())
    }
    const describe = (op) => {
      if (!op) return ''
      if (op.k === 'W') return `<span class="tag w">쓰기</span><b>${op.t}</b>: ${op.w}`
      const tag = op.f ? '<span class="tag f">쓰기 뒤 읽기</span>' : '<span class="tag r">읽기</span>'
      const by = op.b.replace(/</g, '&lt;')
      return `${tag}<b>${op.t}</b>.${op.a} ← ${by}${op.f ? '<br>앞서 값을 읽은 뒤 DOM이 바뀌었습니다. 실제로 레이아웃을 다시 계산하는지는 브라우저에서 확인해야 합니다.' : ''}`
    }
    function render(n) {
      step = Math.max(0, Math.min(n, maxLen()))
      $('step').value = String(step)
      $('step-output').textContent = `${step} / ${maxLen()}`
      for (const v of versions) {
        const ops = seq(v)
        const done = Math.min(step, ops.length)
        const spans = cards[v].querElementsStrip ??= cards[v].querySelectorAll('.strip span')
        spans.forEach((el, i) => { el.classList.toggle('done', i < done); el.classList.toggle('now', i === done - 1) })
        const shown = ops.slice(0, done)
        const reads = shown.filter((o) => o.k === 'R').length
        const forced = shown.filter((o) => o.k === 'R' && o.f).length
        cards[v].querySelector('[data-stat="step"]').textContent = `${done} / ${ops.length}`
        cards[v].querySelector('[data-stat="rw"]').textContent = `${reads} / ${shown.length - reads}`
        cards[v].querySelector('[data-stat="forced"]').textContent = String(forced)
        cards[v].querySelector('.op').innerHTML = done === 0 ? `${data[v][current].from} → ${data[v][current].to}. 재생을 누르거나 막대를 움직여 보세요.` : describe(ops[done - 1])
      }
      if (!timer) $('play').textContent = step >= maxLen() ? '다시 재생' : '재생'
    }
    function pause() { clearInterval(timer); timer = 0; $('play').textContent = step >= maxLen() ? '다시 재생' : '재생' }
    $('play').addEventListener('click', () => {
      if (timer) { pause(); return }
      if (reducedMotion.matches) { render(maxLen()); pause(); return }
      if (step >= maxLen()) render(0)
      $('play').textContent = '일시 정지'
      timer = setInterval(() => { render(step + 1); if (step >= maxLen()) pause() }, 45)
    })
    $('restart').addEventListener('click', () => { pause(); render(0) })
    $('next-forced').addEventListener('click', () => {
      pause()
      const next = Math.min(...versions.map((v) => { const i = seq(v).findIndex((op, idx) => idx >= step && op.k === 'R' && op.f); return i < 0 ? Infinity : i + 1 }))
      render(Number.isFinite(next) ? next : maxLen())
    })
    $('step').addEventListener('input', (event) => { pause(); render(Number(event.target.value)) })
    $('scenario').addEventListener('change', (event) => { pause(); current = event.target.value; for (const v of versions) delete cards[v].querElementsStrip; build(); render(0) })
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause() })
    window.addEventListener('pagehide', pause)
    build()
    render(0)
  } else {
    const field = $('field')
    let boxes = []
    function fill() {
      const n = Number($('count').value)
      boxes = Array.from({length: n}, () => document.createElement('i'))
      field.replaceChildren(...boxes)
      $('ms-interleaved').textContent = '-'
      $('ms-batched').textContent = '-'
      $('bar-interleaved').style.width = '0'
      $('bar-batched').style.width = '0'
    }
    const flip = (w) => (w > 44 ? '40px' : '56px')
    const median = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.floor(s.length / 2)] }
    function prepareRun() {
      boxes.forEach((box) => { box.style.width = '40px' })
      void field.offsetHeight
    }
    function runInterleaved() {
      prepareRun()
      const t0 = performance.now()
      for (const box of boxes) box.style.width = flip(box.offsetWidth)
      void field.offsetHeight // 마지막 쓰기의 레이아웃까지 측정
      return performance.now() - t0
    }
    function runBatched() {
      prepareRun()
      const t0 = performance.now()
      const widths = boxes.map((box) => box.offsetWidth)
      boxes.forEach((box, i) => { box.style.width = flip(widths[i]) })
      void field.offsetHeight
      return performance.now() - t0
    }
    const results = {interleaved: null, batched: null}
    function show() {
      const max = Math.max(results.interleaved ?? 0, results.batched ?? 0, 0.01)
      for (const key of ['interleaved', 'batched']) {
        const ms = results[key]
        $(`ms-${key}`).textContent = ms == null ? '-' : `${ms.toFixed(2)} ms`
        $(`bar-${key}`).style.width = ms == null ? '0' : `${Math.max(2, (ms / max) * 100)}%`
      }
      const n = boxes.length
      if (results.interleaved != null && results.batched != null) {
        const ratio = results.interleaved / Math.max(results.batched, 0.001)
        $('thrash-note').textContent = `상자 ${n}개를 바꿨습니다. 마지막 레이아웃 계산까지 포함하면, 쓰기 뒤의 읽기는 섞어서 ${n}번, 모아서 1번입니다. 실행 시간의 중앙값은 ${ratio.toFixed(1)}배 차이가 났습니다. 페인트와 합성 시간은 제외한 값입니다.`
      } else {
        $('thrash-note').textContent = `상자 ${n}개. 다른 버튼도 눌러 비교해 보세요.`
      }
    }
    $('run-interleaved').addEventListener('click', () => { results.interleaved = median(Array.from({length: 5}, runInterleaved)); show() })
    $('run-batched').addEventListener('click', () => { results.batched = median(Array.from({length: 5}, runBatched)); show() })
    $('count').addEventListener('change', () => { results.interleaved = null; results.batched = null; fill(); show() })
    fill()
  }
</script>
</body>
</html>
