[package]
name = "syntect-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["fancy"]
fancy = ["syntect/regex-fancy", "dep:fancy-regex"]
onig = ["syntect/regex-onig"]

[dependencies]
syntect = { version = "=5.3.0", default-features = false, features = [
  "default-syntaxes",
] }
fancy-regex = { version = "=0.16.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]
