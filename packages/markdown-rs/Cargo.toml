[package]
name = "markdown-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
markdown = { path = "vendor/markdown-rs", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
math-core = "=0.5.0"
roxmltree = "0.21"
imagesize = "0.14"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]
