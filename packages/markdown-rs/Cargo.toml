[package]
name = "markdown-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
markdown = { path = "vendor/markdown-rs", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]
